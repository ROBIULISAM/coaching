<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoachPro Academy - Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --bg: #f4f6f9; 
      --surface: #ffffff;
      --surface2: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --text2: #64748b;
      --text3: #94a3b8;
      --brand: #0f172a;
      --accent: #2563eb;
      --green: #10b981;
      --red: #ef4444;
      --gray-btn: #94a3b8;
      --radius: 20px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 85px; }
    
    header { background: #131926; padding: 16px; color: white; display: flex; justify-content: space-between; align-items: center; }
    .logo-block { display: flex; align-items: center; gap: 10px; }
    .logo-icon { background: #3b82f6; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; }
    .logo-text { font-size: 18px; font-weight: 700; color: #fff; }
    .logo-sub { font-size: 11px; color: #94a3b8; }
    .sync-badge { background: rgba(16, 185, 129, 0.1); padding: 5px 12px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(16, 185, 129, 0.2); color: #34d399; }
    .cloud-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; }

    .container { max-width: 500px; margin: 0 auto; padding: 14px; }
    .screen { display: none; } .screen.on { display: block; }
    
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .card-body { padding: 16px; }
    .card-row { display: flex; gap: 14px; padding: 16px; }
    .av { width: 44px; height: 44px; background: #eff6ff; color: #2563eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
    .si { flex: 1; min-width: 0; }
    .sn { font-weight: 700; font-size: 16px; color: #1e293b; }
    .sm { font-size: 13px; color: var(--text2); margin-top: 2px; }
    
    .pill { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-left: 6px; }
    .pill-blue { background: #eff6ff; color: #2563eb; }
    .pill-green { background: #d1fae5; color: #065f46; }
    .pill-red { background: #fee2e2; color: #991b1b; }
    
    .status-lbl { font-size: 12px; font-weight: 600; color: var(--text2); margin-top: 12px; margin-bottom: 6px; }
    .months-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 8px; }
    .month-btn { padding: 8px 0; border-radius: 6px; border: none; font-size: 12px; font-weight: 700; text-align: center; color: white; }
    .month-paid { background: var(--green); }
    .month-due { background: var(--red); }
    .month-na { background: var(--gray-btn); }
    
    .ind-row { display: flex; gap: 10px; font-size: 12px; color: var(--text2); font-weight: 500; margin-bottom: 4px; }
    .ind { display: inline-flex; align-items: center; gap: 4px; }
    .ind::before { content:''; width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .ind-p::before { background: var(--green); }
    .ind-d::before { background: var(--red); }
    .ind-n::before { background: var(--gray-btn); }

    .card-footer-info { text-align: right; font-size: 12px; color: var(--text2); padding: 8px 16px; background: #f8fafc; border-top: 1px solid var(--border); font-weight: 500; }
    
    .action-bar { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: #f8fafc; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: white; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-pay { background: var(--green); color: white; border-color: var(--green); flex: 2; }
    .btn-ledger { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; flex: 1.5; }
    .btn-edit { background: #fffbeb; color: #d97706; border-color: #fde68a; width: 42px; padding: 0; }
    .btn-del { background: #fef2f2; color: var(--red); border-color: #fca5a5; width: 42px; padding: 0; }
    
    .search-box { position: relative; margin-bottom: 16px; }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 18px; }
    .form-control { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; background: white; outline: none; color: var(--text); }
    .search-box input { padding-left: 42px; border-radius: 25px; border: 1px solid #cbd5e1; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }

    .filter-row { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 4px; }
    .fb { padding: 6px 16px; border-radius: 20px; background: white; border: 1px solid #cbd5e1; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; white-space: nowrap; }
    .fb.on { background: #0f172a; color: white; border-color: #0f172a; }

    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
    .stat-card { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
    .stat-info .lbl { font-size: 11px; color: var(--text2); font-weight: 600; text-transform: uppercase; }
    .stat-info .val { font-size: 22px; font-weight: 800; margin-top: 4px; }
    .stat-info .val.blue { color: #2563eb; } .stat-info .val.green { color: var(--green); } .stat-info .val.red { color: var(--red); }
    
    .bnb { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border); display: flex; height: 65px; z-index: 500; }
    .bnb-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: none; border: none; color: var(--text2); font-size: 11px; font-weight: 500; gap: 4px; cursor: pointer; }
    .bnb-btn.on { color: #2563eb; font-weight: 700; }
    .bnb-btn i { font-size: 22px; }

    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal.on { opacity: 1; pointer-events: auto; }
    .modal-content { background: white; width: 100%; max-width: 500px; border-radius: var(--radius) var(--radius) 0 0; padding: 20px; transform: translateY(100%); transition: transform 0.2s; max-height: 85vh; overflow-y: auto; }
    .modal.on .modal-content { transform: translateY(0); }
    .modal-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-t { font-size: 18px; font-weight: 700; }
    
    .sum3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .sum-box { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; text-align: center; background: #f8fafc; }
    .sum-lbl { font-size: 11px; color: var(--text2); font-weight: 600; }
    .sum-val { font-size: 14px; font-weight: 700; margin-top: 4px; }
    
    .ledger-tbl { width: 100%; border-collapse: collapse; text-align: left; }
    .ledger-tbl th { font-size: 12px; font-weight: 600; color: var(--text2); padding: 10px; background: var(--surface2); }
    .ledger-tbl td { padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }

    .toast { position: fixed; top: 20px; left: 50%; transform: translate(-50%, -100%); background: #0f172a; color: white; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 2000; pointer-events: none; }
    .toast.on { transform: translate(-50%, 0); opacity: 1; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="logo-block">
      <div class="logo-icon"><i class="ti ti-school"></i></div>
      <div>
        <div class="logo-text">CoachPro Academy</div>
        <div class="logo-sub">Cloud Management System</div>
      </div>
    </div>
    <div class="sync-badge">
      <span id="sync-dot" class="cloud-dot"></span> <span id="sync-label">Live ✓</span>
    </div>
  </header>

  <div class="container">
    
    <div id="s-dashboard" class="screen on">
      <div class="kpi-grid">
        <div class="stat-card">
          <div class="stat-info"><div class="lbl">Total Students</div><div id="k-students" class="val blue">0</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-info"><div class="lbl">Total Collected</div><div id="k-cash" class="val green">৳0</div></div>
        </div>
      </div>
      <div class="stat-card" style="margin-bottom:16px">
        <div class="stat-info"><div class="lbl">Total Outstanding Due</div><div id="k-due" class="val red" style="font-size:24px">৳0</div></div>
      </div>
    </div>

    <div id="s-students" class="screen">
      <div class="search-box"><i class="ti ti-search"></i><input type="text" class="form-control" placeholder="Search name or phone..." oninput="srch(this.value)"></div>
      <div class="filter-row">
        <button class="fb on" onclick="clsF('all',this)">All</button>
        <button class="fb" onclick="clsF('Class 6',this)">Class 6</button>
        <button class="fb" onclick="clsF('Class 7',this)">Class 7</button>
        <button class="fb" onclick="clsF('Class 8',this)">Class 8</button>
        <button class="fb" onclick="clsF('Class 9',this)">Class 9</button>
        <button class="fb" onclick="clsF('Class 10',this)">Class 10</button>
      </div>
      <div id="student-list"></div>
    </div>

    <div id="s-payment" class="screen">
      <div class="card card-body">
        <div style="font-weight:700;margin-bottom:14px;font-size:16px;color:var(--green)"><i class="ti ti-plus"></i> Collect New Payment</div>
        <div class="form-group"><label>Select Student</label><select id="ps" class="form-control"></select></div>
        <div class="form-group"><label>Amount (TK)</label><input type="number" id="pa" class="form-control" placeholder="e.g. 1000"></div>
        <div class="form-group"><label>Note / Reference</label><input type="text" id="pn" class="form-control" placeholder="e.g. Monthly Fee"></div>
        <button class="btn btn-pay" style="width:100%" onclick="doPayment()"><i class="ti ti-check"></i> Submit Payment</button>
      </div>
    </div>

    <div id="s-register" class="screen">
      <div class="card card-body">
        <div id="reg-title" style="font-weight:700;margin-bottom:16px;font-size:16px;color:var(--accent)"><i class="ti ti-user-plus"></i> Register New Student</div>
        <input type="hidden" id="edit-id">
        <div class="form-group"><label>Student Name *</label><input type="text" id="rn" class="form-control" placeholder="Full name"></div>
        <div class="form-group"><label>Class / Batch *</label><select id="rc" class="form-control"><option value="">— select —</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option></select></div>
        <div class="form-group"><label>Monthly Fee (TK) *</label><input type="number" id="rf" class="form-control" placeholder="Amount per month"></div>
        <div class="form-group"><label>Phone Number</label><input type="tel" id="rph" class="form-control" placeholder="01xxx-xxxxxx"></div>
        <button class="btn btn-pay" style="width:100%; background:var(--accent); border-color:var(--accent);" onclick="doRegister()"><i class="ti ti-user-check"></i> Save Student</button>
      </div>
    </div>
  </div>

  <nav class="bnb">
    <button class="bnb-btn on" onclick="goScreen('dashboard',this)"><i class="ti ti-smart-home"></i>Dashboard</button>
    <button class="bnb-btn" onclick="goScreen('students',this)"><i class="ti ti-users"></i>Students</button>
    <button class="bnb-btn" onclick="goScreen('payment',this)"><i class="ti ti-wallet"></i>Payments</button>
    <button class="bnb-btn" onclick="goScreen('register',this)"><i class="ti ti-user-plus"></i>Register</button>
  </nav>

  <div id="modal-bd" class="modal" onclick="closeMod(event)">
    <div class="modal-content">
      <div class="modal-h"><div class="modal-t" id="modal-title">Student Ledger</div><button class="btn btn-sm" onclick="closeMod(null,true)" style="background:transparent; border:none;"><i class="ti ti-x" style="font-size:20px"></i></button></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast"><span id="tmsg">Done</span></div>

  <script>
    const SUPABASE_URL = 'https://ihegxlhqppawbwgsgytq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloZWd4bGhxcHBhd2J3Z3NneXRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNjI2MzgsImV4cCI6MjA5NTYzODYzOH0.TklHPf7ARXlABCnuTQYrnQFZ_ZnO4EArofRJ-7JD6RQ';
    const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let SS = []; 
    let clf = 'all', sq = '';
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function safeParse(d, fallback) {
      if(!d) return fallback;
      if(typeof d === 'object') return d;
      try { return JSON.parse(d); } catch(e) { return fallback; }
    }

    async function fetchCloud(){
      try {
        const {data,error} = await _sb.from('coaching_students').select('*').order('id',{ascending:true});
        if(error) throw error;
        SS = data || [];
        document.getElementById('sync-dot').style.background = '#10b981';
        document.getElementById('sync-label').textContent = 'Live ✓';
      } catch(e){
        document.getElementById('sync-dot').style.background = '#ef4444';
        document.getElementById('sync-label').textContent = 'Offline';
      }
      rDash(); rStudents(); rPaySel();
    }

    function toast(m){
      const t=document.getElementById('toast'); document.getElementById('tmsg').textContent=m;
      t.classList.add('on'); setTimeout(()=>t.classList.remove('on'),2500);
    }
    
    function ini(n){return (n || '??').trim().split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?'}
    function fmt(n){return '৳'+Math.round(n || 0).toLocaleString()}

    function getStudentStats(s) {
      const fee = parseFloat(s.fee || 0);
      const logs = safeParse(s.payment_logs, []);
      
      let paidTotal = 0;
      if(Array.isArray(logs)){
        paidTotal = logs.reduce((sum, log) => sum + parseFloat(log.amount || 0), 0);
      }
      
      // চলতি মাস (জুন) পর্যন্ত কয়টি মাস অতিক্রান্ত হয়েছে তার অটোমেটিক হিসাব
      const currentMonthIndex = new Date().getMonth(); // জুন = ৫
      const totalActiveMonths = currentMonthIndex + 1; // মোট ৬ মাস (Jan to Jun)
      
      // মোট জেনারেটেড ফি
      const genTotal = totalActiveMonths * fee;
      
      // কয়টি মাসের ফি সম্পূর্ণ ক্লিয়ার হয়েছে তা লেজারের টাকা থেকে অটোমেটিক বের করা
      let tempPaid = paidTotal;
      let pCount = 0;
      let dCount = 0;
      
      const monthStatus = {};
      
      for(let i = 0; i < 12; i++) {
        const m = MONTHS[i];
        if (i <= currentMonthIndex) {
          if (tempPaid >= fee) {
            monthStatus[m] = 'paid';
            pCount++;
            tempPaid -= fee;
          } else {
            monthStatus[m] = 'due';
            dCount++;
          }
        } else {
          monthStatus[m] = 'na';
        }
      }

      let dueTotal = genTotal - paidTotal;
      if(dueTotal < 0) dueTotal = 0; 

      return { 
        paid: paidTotal, 
        due: dueTotal, 
        gen: genTotal, 
        pCount, 
        dCount, 
        naCount: 12 - (pCount + dCount),
        monthStatus 
      };
    }

    function goScreen(name,btn){
      document.querySelectorAll('.screen').forEach(el=>el.classList.remove('on'));
      document.querySelectorAll('.bnb-btn').forEach(el=>el.classList.remove('on'));
      document.getElementById('s-'+name).classList.add('on');
      if(btn) btn.classList.add('on');
      if(name=='dashboard') rDash();
      if(name=='students') rStudents();
      if(name=='payment') rPaySel();
    }

    function rDash(){
      document.getElementById('k-students').textContent=SS.length;
      let totalPaid=SS.reduce((a,s)=>a+getStudentStats(s).paid,0);
      let totalDue=SS.reduce((a,s)=>a+getStudentStats(s).due,0);
      document.getElementById('k-cash').textContent=fmt(totalPaid);
      document.getElementById('k-due').textContent=fmt(totalDue);
    }

    function rStudents(){
      const el=document.getElementById('student-list');
      let list=SS;
      if(clf!=='all') list=list.filter(s=>s.class===clf);
      if(sq) list=list.filter(s=>s.name && (s.name.toLowerCase().includes(sq) || (s.phone && s.phone.includes(sq))));
      
      if(!list.length){el.innerHTML=`<div style="text-align:center;padding:40px;color:var(--text3)">No students found</div>`;return;}
      
      el.innerHTML=list.map(s=>{
        const stat = getStudentStats(s);
        const isPaidUp = stat.due <= 0;
        
        return `<div class="card">
          <div class="card-row">
            <div class="av">${ini(s.name)}</div>
            <div class="si">
              <div style="display:flex;align-items:center;justify-content:between;width:100%;flex-wrap:wrap;gap:4px">
                <span class="sn" style="flex:1">${s.name || 'Unknown'}</span>
                <div>
                  <span class="pill pill-blue">${s.class || 'N/A'}</span>
                  ${isPaidUp ? '<span class="pill pill-green">Paid up</span>' : `<span class="pill pill-red">Due ${fmt(stat.due)}</span>`}
                </div>
              </div>
              <div class="sm">${fmt(s.fee)}/month · ${s.phone || 'No Phone'}</div>
              
              <div class="status-lbl">Month status (Auto-calculated from payments)</div>
              <div class="months-grid">
                ${MONTHS.map(m => {
                  const st = stat.monthStatus[m] || 'due';
                  let cls = 'month-due';
                  if (st === 'paid') cls = 'month-paid';
                  if (st === 'na') cls = 'month-na';
                  return `<button class="month-btn ${cls}" style="pointer-events:none;">${m}</button>`;
                }).join('')}
              </div>
              
              <div class="ind-row">
                <span class="ind ind-p">${stat.pCount} paid</span>
                <span class="ind ind-d">${stat.dCount} due</span>
                <span class="ind ind-n">${stat.naCount} upcoming</span>
              </div>
            </div>
          </div>
          <div class="card-footer-info">${fmt(stat.paid)} collected · ${fmt(stat.due)} outstanding due</div>
          <div class="action-bar">
            <button class="btn btn-ledger" onclick="openLedger(${s.id})"><i class="ti ti-receipt"></i> Ledger</button>
            <button class="btn btn-pay" onclick="qPay(${s.id})"><i class="ti ti-plus"></i> Pay</button>
            <button class="btn btn-edit" onclick="editS(${s.id})"><i class="ti ti-edit"></i></button>
            <button class="btn btn-del" onclick="delS(${s.id})"><i class="ti ti-trash"></i></button>
          </div>
        </div>`;
      }).join('');
    }

    function srch(v){sq=v.toLowerCase();rStudents()}
    function clsF(c,btn){clf=c;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));btn.classList.add('on');rStudents()}

    async function doPayment(){
      const id=document.getElementById('ps').value;
      const amt=parseFloat(document.getElementById('pa').value);
      const note=document.getElementById('pn').value || 'Monthly Fee';
      if(!id||isNaN(amt)||amt<=0) { toast('Please fill out all fields correctly'); return; }

      const s=SS.find(x=>x.id==id); if(!s)return;
      const sLogs = safeParse(s.payment_logs, []);
      
      const newLog = { date: new Date().toISOString().split('T')[0], amount: amt, note: note };
      const updatedLogs = [...sLogs, newLog];

      try {
        await _sb.from('coaching_students').update({ payment_logs: updatedLogs }).eq('id', id);
        s.payment_logs = updatedLogs;
        document.getElementById('pa').value = ''; document.getElementById('pn').value = '';
        toast('৳' + amt + ' Added Successfully!');
        goScreen('students', document.querySelectorAll('.bnb-btn')[1]);
      } catch(e) {
        toast('Payment failed');
      }
    }

    function openLedger(id){
      const s=SS.find(x=>x.id===id); if(!s)return;
      const logs = safeParse(s.payment_logs, []);
      const stat=getStudentStats(s);
      document.getElementById('modal-title').textContent=s.name;
      document.getElementById('modal-body').innerHTML=`
        <div class="sum3">
          <div class="sum-box"><div class="sum-lbl">Generated</div><div class="sum-val" style="color:#2563eb">${fmt(stat.gen)}</div></div>
          <div class="sum-box"><div class="sum-lbl">Collected</div><div class="sum-val" style="color:var(--green)">${fmt(stat.paid)}</div></div>
          <div class="sum-box"><div class="sum-lbl">Due</div><div class="sum-val" style="color:var(--red)">${fmt(stat.due)}</div></div>
        </div>
        <table class="ledger-tbl">
          <thead><tr><th>Date</th><th>Amount</th><th>Note</th><th>Action</th></tr></thead>
          <tbody>
            ${logs.length === 0 ? '<tr><td colspan="4" style="text-align:center;color:var(--text3)">No records found</td></tr>' : 
            logs.map((p,idx)=>`<tr><td>${p.date}</td><td style="color:var(--green);font-weight:700">+${fmt(p.amount)}</td><td>${p.note || 'Fee'}</td><td><button class="btn btn-sm btn-del" onclick="delLog(${s.id},${idx})"><i class="ti ti-trash"></i></button></td></tr>`).join('')}
          </tbody>
        </table>`;
      document.getElementById('modal-bd').classList.add('on');
    }

    async function delLog(sid, idx){
      if(!confirm("Delete this transaction?")) return;
      const s=SS.find(x=>x.id===sid); if(!s) return;
      const logs = safeParse(s.payment_logs, []);
      const updatedLogs = [...logs];
      updatedLogs.splice(idx,1);
      try{
        await _sb.from('coaching_students').update({payment_logs:updatedLogs}).eq('id',sid);
        s.payment_logs=updatedLogs; toast('Transaction Deleted'); closeMod(null,true); rStudents(); rDash();
      }catch(e){toast('Failed')}
    }

    function editS(id){
      const s=SS.find(x=>x.id===id); if(!s) return;
      goScreen('register', document.querySelectorAll('.bnb-btn')[3]);
      document.getElementById('reg-title').innerHTML = `<i class="ti ti-edit"></i> Edit Student Profile`;
      document.getElementById('edit-id').value = s.id;
      document.getElementById('rn').value = s.name;
      document.getElementById('rc').value = s.class;
      document.getElementById('rf').value = s.fee;
      document.getElementById('rph').value = s.phone || '';
    }

    function closeMod(e,force){ if(force||(e && e.target===document.getElementById('modal-bd'))) document.getElementById('modal-bd').classList.remove('on'); }
    function rPaySel(){ document.getElementById('ps').innerHTML='<option value="">— select —</option>'+SS.map(x=>`<option value="${x.id}">${x.name}</option>`).join(''); }
    function qPay(id){ goScreen('payment',document.querySelectorAll('.bnb-btn')[2]); document.getElementById('ps').value=id; }

    async function doRegister(){
      const eid=document.getElementById('edit-id').value;
      const name=document.getElementById('rn').value; const cls=document.getElementById('rc').value;
      const fee=parseFloat(document.getElementById('rf').value); const ph=document.getElementById('rph').value;
      if(!name||!cls||isNaN(fee)) { toast('Please fill required fields'); return; }
      
      if(eid){
        try{
          await _sb.from('coaching_students').update({name, class:cls, fee, phone:ph}).eq('id',eid);
          const s = SS.find(x=>x.id == eid);
          if(s) { s.name=name; s.class=cls; s.fee=fee; s.phone=ph; }
          toast('Profile Updated!');
          document.getElementById('edit-id').value='';
          document.getElementById('reg-title').innerHTML = `<i class="ti ti-user-plus"></i> Register New Student`;
          document.getElementById('rn').value=''; document.getElementById('rf').value=''; document.getElementById('rph').value='';
          goScreen('students',document.querySelectorAll('.bnb-btn')[1]);
        }catch(e){toast('Failed')}
      } else {
        try{
          const {data}=await _sb.from('coaching_students').insert([{name, class:cls, fee, phone:ph, payments:{}, payment_logs:[]}]).select();
          if(data && data.length > 0) SS.push(data[0]);
          document.getElementById('rn').value=''; document.getElementById('rf').value=''; document.getElementById('rph').value='';
          toast('Registered Successfully!'); goScreen('students',document.querySelectorAll('.bnb-btn')[1]);
        }catch(e){toast('Failed')}
      }
    }

    function delS(id){ if(confirm('Delete student completely?')) _sb.from('coaching_students').delete().eq('id',id).then(()=>{SS=SS.filter(x=>x.id!==id);rStudents();rDash(); toast('Deleted');}); }

    window.addEventListener('DOMContentLoaded', fetchCloud);
  </script>
</body>
</html>
