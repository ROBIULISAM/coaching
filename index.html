function ini(n){return n.trim().split(/\s+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?'}
function fmt(n){return '৳'+Math.round(n).toLocaleString()}

// ─── 🛠️ FIXED STATS CALCULATION ─────────────────────────
function getStudentStats(s) {
  const fee = parseFloat(s.fee || 0);
  const payments = s.payments || {};
  let paidTotal = 0;
  let dueTotal = 0;

  MONTHS.forEach(m => {
    const st = payments[m];
    if (st === 'paid') {
      paidTotal += fee;
    } else if (st === 'na') {
      // Do nothing
    } else if (st !== undefined && st !== null && !isNaN(parseFloat(st))) {
      const partialVal = parseFloat(st);
      paidTotal += partialVal;
      dueTotal += (fee - partialVal);
    } else { 
      dueTotal += fee;
    }
  });

  return { paid: paidTotal, due: dueTotal, gen: paidTotal + dueTotal };
}

function sGen(s){ return getStudentStats(s).gen; }
function sPaid(s){ return getStudentStats(s).paid; }
function sDue(s){ return getStudentStats(s).due; }

}

// ─── DASHBOARD ─────────────────────────────────────────
function rDash(){

  const totalDue=SS.reduce((a,s)=>a+sDue(s),0);

// ─── MONTHS HTML GENERATOR ─────────────────────────────
function generateMonthsHtml(s) {
  const payments = s.payments || {};
  
  return MONTHS.map(m => {
    const st = payments[m];
    let cls = 'month-due';
    let label = m;
    let subtext = '';

    if (st === 'paid') {
      cls = 'month-paid';
    } else if (st === 'na') {
      cls = 'month-na';
    } else if (st !== undefined && st !== null && !isNaN(parseFloat(st))) {
      cls = 'month-partial';
      subtext = `<span class="month-subtext">${fmt(parseFloat(st))}</span>`;
    }
    
    return `<button class="month-btn ${cls}" onclick="toggleMonth(${s.id},'${m}')">${label}${subtext}</button>`;
  }).join('');
}

// ─── MONTH TOGGLE ──────────────────────────────────────
async function toggleMonth(dbId, month){
  const s=SS.find(x=>x.id===dbId); if(!s)return;
  const cur=(s.payments||{})[month]||'due';
  
  let next = 'due';
  if (cur === 'due' || !isNaN(parseFloat(cur))) next = 'paid';
  else if (cur === 'paid') next = 'na';
  else if (cur === 'na') next = 'due';

  const updated={...(s.payments||{})};
  updated[month]=next;
  try{
    await _sb.from('coaching_students').update({payments:updated}).eq('id',dbId);
    s.payments=updated;
    rStudents(); rDash();
    if(document.getElementById('modal-bd').classList.contains('on')) openLedger(dbId);
    toast(month+' → '+ (typeof next==='string'?next.toUpperCase():fmt(next)));
  }catch(e){toast('Update failed')}
}

async function delS(id){
  if(!confirm('Delete this student from cloud?'))return;
  try{
    await _sb.from('coaching_students').delete().eq('id',id);
    SS=SS.filter(s=>s.id!==id);
    rStudents(); rDash(); rPaySel();
    toast('Student deleted');
  }catch(e){toast('Delete failed')}
}

// ─── 🗑️ DELETE PAYMENT LOG FUNCTION ─────────────────────
async function deletePaymentLog(studentId, logIndex) {
  const s = SS.find(x => x.id === studentId);
  if (!s || !s.payment_logs) return;

  if (!confirm("আপনি কি নিশ্চিত যে এই পেমেন্ট হিস্ট্রিটি চিরতরে ডিলিট করতে চান?")) return;

  // নির্দিষ্ট ইনডেক্সের লগ বাদ দিয়ে নতুন অ্যারে তৈরি করা
  const updatedLogs = [...s.payment_logs];
  updatedLogs.splice(logIndex, 1);

  try {
    setSyncStatus(false, 'Updating Cloud…');
    
    // Supabase ডাটাবেজ আপডেট
    const { error } = await _sb
      .from('coaching_students')
      .update({ payment_logs: updatedLogs })
      .eq('id', studentId);

    if (error) throw error;

    // লোকাল স্টেট আপডেট
    s.payment_logs = updatedLogs;
    
    toast("পেমেন্ট সফলভাবে ডিলিট হয়েছে!");
    
    // সমস্ত ড্যাশবোর্ড ও স্ক্রিন রি-রেন্ডার করা
    rDash(); 
    rStudents(); 
    rPayHist();
    
    // লেজার মোডালটি রিফ্রেশড ডাটা দিয়ে পুনরায় ওপেন রাখা
    openLedger(studentId);

  } catch (e) {
    console.error(e);
    toast("ডিলিট করতে সমস্যা হয়েছে!");
    setSyncStatus(false, 'Offline');
  }
}

function closeMod(e,force){
  if(force||!e||e.target===document.getElementById('modal-bd')){
    document.getElementById('modal-bd').classList.remove('on');
    document.body.style.overflow='';
  }
}

// ─── PAYMENTS SCREEN ADDITIONAL FUNCTIONS ───────────────
function rPaySel(){
  const s=document.getElementById('ps');
  s.innerHTML='<option value="">— choose student —</option>'+SS.map(x=>`<option value="${x.id}">${x.name} (${x.class})</option>`).join('');
}

function pSel(id){
  const div=document.getElementById('pay-info');
  if(!id){div.style.display='none';return;}
  const s=SS.find(x=>x.id==id); if(!s){div.style.display='none';return;}
  div.style.display='block';
  document.getElementById('pi-fee').textContent=fmt(s.fee);
  document.getElementById('pi-gen').textContent=fmt(sGen(s));
  document.getElementById('pi-paid').textContent=fmt(sPaid(s));
  document.getElementById('pi-due').textContent=fmt(sDue(s));
}

async function doPayment(){
  const id=document.getElementById('ps').value;
  const amt=parseFloat(document.getElementById('pa').value);
  const note=document.getElementById('pn').value;
  if(!id||isNaN(amt)||amt<=0){toast('Enter valid student and amount');return;}
  
  const s=SS.find(x=>x.id==id); if(!s)return;
  const logs=s.payment_logs||[];
  const newLog={date:new Date().toISOString().split('T')[0],amount:amt,note:note||'Payment'};
  const updatedLogs=[...logs,newLog];

  try{
    await _sb.from('coaching_students').update({payment_logs:updatedLogs}).eq('id',id);
    s.payment_logs=updatedLogs;
    document.getElementById('pa').value=''; document.getElementById('pn').value='';
    pSel(id); rDash(); rPayHist(); toast('Payment recorded');
  }catch(e){toast('Payment failed')}
}

function qPay(id){
  goScreen('payment',document.querySelectorAll('.bnb')[2]);
  document.getElementById('ps').value=id; pSel(id);
}

function rPayHist(){
  const el=document.getElementById('pay-hist');
  let arr=[];
  SS.forEach(s=>{
    if(s.payment_logs) s.payment_logs.forEach((l, idx)=>arr.push({...l, sName:s.name, sClass:s.class, sId:s.id, realIdx:idx}));
  });
  arr.sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!arr.length){el.innerHTML='<div class="empty"><i class="ti ti-receipt"></i><div class="empty-txt">No payment history</div></div>';return;}
  
  el.innerHTML=arr.map(p=>`<div class="card card-body" style="margin-bottom:8px;padding:12px">
    <div style="display:flex;justify-content:between;align-items:center;width:100%">
      <div style="flex:1">
        <div style="font-weight:600;font-size:14px">${p.sName} <span style="font-size:11px;color:var(--text2);font-weight:normal">${p.sClass}</span></div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px">${p.date} · ${p.note}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="pill pill-green" style="font-size:13px;padding:4px 10px">+${fmt(p.amount)}</span>
        <button class="btn btn-sm btn-danger" style="padding:0 8px; height:28px; width:auto;" onclick="deletePaymentLog(${p.sId}, ${p.realIdx})">
          <i class="ti ti-trash"></i>
        </button>
      </div>
    </div>
  </div>`).join('');
}

// ─── REGISTER SCREEN ───────────────────────────────────
async function doRegister(){
  const id=document.getElementById('edit-id').value;
  const name=document.getElementById('rn').value.trim();
  const cls=document.getElementById('rc').value;
  const fee=parseFloat(document.getElementById('rf').value);
  const ph=document.getElementById('rph').value.trim()||'N/A';

  if(!name||!cls||isNaN(fee)){toast('Fill all required fields');return;}

  if(id){
    // Edit existing student
    try{
      const s=SS.find(x=>x.id==id);
      const payload={name,class:cls,fee,phone:ph};
      await _sb.from('coaching_students').update(payload).eq('id',id);
      Object.assign(s,payload);
      resetRegForm(); goScreen('students',document.querySelectorAll('.bnb')[1]); toast('Student updated');
    }catch(e){toast('Update failed')}
  }else{
    // Register new student
    try{
      const payload={name,class:cls,fee,phone:ph,payments:{},payment_logs:[]};
      const {data,error}=await _sb.from('coaching_students').insert([payload]).select();
      if(error)throw error;
      if(data&&data[0]) SS.push(data[0]);
      resetRegForm(); goScreen('dashboard',document.querySelectorAll('.bnb')[0]); toast('Student registered');
    }catch(e){toast('Registration failed')}
  }
}

function editStudent(id){
  const s=SS.find(x=>x.id===id); if(!s)return;
  goScreen('register',document.querySelectorAll('.bnb')[3]);
  document.getElementById('edit-id').value=s.id;
  document.getElementById('rn').value=s.name;
  document.getElementById('rc').value=s.class;
  document.getElementById('rf').value=s.fee;
  document.getElementById('rph').value=s.phone==='N/A'?'':s.phone;
  document.getElementById('reg-title').innerHTML='<i class="ti ti-pencil"></i> Edit student information';
  document.getElementById('reg-submit-btn').innerHTML='<i class="ti ti-check"></i> Update student';
  document.getElementById('reg-cancel-btn').style.display='inline-flex';
}

function resetRegForm(){
  document.getElementById('edit-id').value='';
  document.getElementById('rn').value=''; document.getElementById('rc').value='';
  document.getElementById('rf').value=''; document.getElementById('rph').value='';
  document.getElementById('reg-title').innerHTML='<i class="ti ti-user-plus"></i> New student registration';
  document.getElementById('reg-submit-btn').innerHTML='<i class="ti ti-user-check"></i> Add student';
  document.getElementById('reg-cancel-btn').style.display='none';
}
