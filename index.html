<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoachPro - Mobile Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --na-color: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Mobile Friendly Top Header Replacement for Sidebar */
        .top-navbar { background-color: #0f172a; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .top-navbar h2 { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; }
        .top-navbar h2 i { color: #818cf8; }

        .main-content { width: 100%; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        
        header { background: var(--card-bg); padding: 1rem; border-radius: 0.75rem; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 0.5rem; }
        header h1 { font-size: 1.25rem; font-weight: 700; color: #1e293b; }

        .secure-badge { background: #d1fae5; color: #065f46; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; width: fit-content; }

        /* Responsive Stats Grid */
        .stats-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
        @media(min-width: 600px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
        .stat-card { background: var(--card-bg); padding: 1rem; border-radius: 0.75rem; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
        .stat-info h3 { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 0.25rem; }
        .stat-info p { font-size: 1.35rem; font-weight: 700; color: #1e293b; }
        .stat-icon { width: 40px; height: 40px; border-radius: 0.5rem; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
        .icon-blue { background: #eff6ff; color: #3b82f6; }
        .icon-green { background: #ecfdf5; color: #10b981; }
        .icon-red { background: #fef2f2; color: #ef4444; }

        /* Search and Filters */
        .search-container { background: var(--card-bg); padding: 1rem; border-radius: 0.75rem; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 0.75rem; }
        @media(min-width: 600px) { .search-container { flex-direction: row; } }
        .search-box { position: relative; flex: 1; }
        .search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input { width: 100%; padding: 0.65rem 1rem 0.65rem 2.5rem; border: 1px solid var(--border-color); border-radius: 0.5rem; outline: none; font-size: 0.9rem; }
        .filter-select { width: 100%; padding: 0.65rem 1rem; border: 1px solid var(--border-color); border-radius: 0.5rem; outline: none; font-size: 0.9rem; background: #fff; }
        @media(min-width: 600px) { .filter-select { width: auto; min-width: 180px; } }

        /* Class Sections & Tables */
        .class-section { background: var(--card-bg); padding: 1rem; border-radius: 0.75rem; border: 1px solid var(--border-color); }
        .class-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #f1f5f9; }
        .class-header h2 { font-size: 1.1rem; color: #1e293b; font-weight: 700; }
        .class-badge-count { background: #e2e8f0; color: #475569; padding: 2px 8px; border-radius: 9999px; font-size: 0.8rem; }

        /* Smooth Table Scrolling For Mobile */
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 0.5rem; border-radius: 0.5rem; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; white-space: nowrap; }
        th, td { padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border-color); }
        th { background-color: #f8fafc; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; }
        
        /* Forms Layout */
        .bottom-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        @media(min-width: 800px) { .bottom-grid { grid-template-columns: 1fr 1fr; } }
        .section { background: var(--card-bg); padding: 1.2rem; border-radius: 0.75rem; border: 1px solid var(--border-color); }
        .section-header { margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); }
        .section-header h2 { font-size: 1rem; font-weight: 700; color: #1e293b; display: flex; align-items: center; gap: 0.5rem; }
        
        .form-vertical { display: flex; flex-direction: column; gap: 1rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.8rem; font-weight: 600; color: #475569; }
        .form-group input, .form-group select { padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.375rem; outline: none; font-size: 0.85rem; -webkit-appearance: none; }
        
        .btn { background-color: var(--primary-color); color: white; padding: 0.65rem 1rem; border: none; border-radius: 0.375rem; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.85rem; }
        .btn-success { background-color: var(--success); }
        .btn-danger { background-color: var(--danger); }
        
        /* Compact 12-Month Grid Optimized for Touch Screen */
        .months-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 100%; min-width: 180px; max-width: 220px; }
        .month-btn { padding: 6px 2px; font-size: 0.65rem; font-weight: 700; text-align: center; border: none; border-radius: 4px; color: white; cursor: pointer; }
        .month-paid { background-color: var(--success); }
        .month-due { background-color: var(--danger); }
        .month-na { background-color: var(--na-color); }

        .due-badge { background-color: #fee2e2; color: #b91c1c; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 0.75rem; }
        .clean-badge { background-color: #d1fae5; color: #065f46; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 0.75rem; }

        .actions-cell { display: flex; gap: 0.5rem; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 0.95rem; padding: 4px; }
        .action-edit { color: var(--primary-color); }
        .action-delete { color: var(--danger); }
        .action-receipt { color: var(--warning); }

        /* Modal Overlay for Mobile */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); align-items: center; justify-content: center; padding: 1rem; }
        .modal-content { background: white; padding: 1.2rem; border-radius: 0.75rem; width: 100%; max-width: 450px; position: relative; max-height: 85vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 0.5rem; right: 1rem; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); }
        
        .receipt-header { text-align: center; margin-bottom: 1rem; border-bottom: 2px dashed var(--border-color); padding-bottom: 0.5rem; }
        .receipt-info { display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 0.8rem; }
        .receipt-table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.8rem; }
        .receipt-table th, .receipt-table td { padding: 0.5rem; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>

    <div class="top-navbar">
        <h2><i class="fa-solid fa-graduation-cap"></i> CoachPro Panel</h2>
    </div>

    <div class="main-content">
        <header>
            <h1>Management Dashboard</h1>
            <span class="secure-badge"><i class="fa-solid fa-mobile-screen-button"></i> Mobile Engine Ready</span>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info"><h3>Total Students</h3><p id="totalStudentsCount">0</p></div>
                <div class="stat-icon icon-blue"><i class="fa-solid fa-users"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info"><h3>Total Cash</h3><p id="totalEarnings">0 BDT</p></div>
                <div class="stat-icon icon-green"><i class="fa-solid fa-money-bill-wave"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info"><h3>Total Due</h3><p id="totalDue" style="color: var(--danger);">0 BDT</p></div>
                <div class="stat-icon icon-red"><i class="fa-solid fa-file-invoice-dollar"></i></div>
            </div>
        </div>

        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="dashboardSearchInput" onkeyup="renderApp()" placeholder="Search by name/phone...">
            </div>
            <select id="classFilterDropdown" class="filter-select" onchange="renderApp()">
                <option value="All">All Classes View</option>
                <option value="Class 6">Class 6 Only</option>
                <option value="Class 7">Class 7 Only</option>
                <option value="Class 8">Class 8 Only</option>
                <option value="Class 9">Class 9 Only</option>
                <option value="Class 10">Class 10 Only</option>
            </select>
        </div>

        <div id="classTablesContainer"></div>

        <div class="bottom-grid">
            <div class="section" style="background: #fffbeb; border: 1px solid #fde68a;">
                <div class="section-header" style="border-bottom-color: #fcd34d;">
                    <h2><i class="fa-solid fa-cash-register" style="color:#d97706;"></i> 1. Due Payment Collection</h2>
                </div>
                <form id="quickPayForm" class="form-vertical" onsubmit="handleDuePayment(event)">
                    <div class="form-group">
                        <label>Select Student *</label>
                        <select id="payStudentID" required><option value="">Choose Student...</option></select>
                    </div>
                    <div class="form-group">
                        <label>Amount Collected (BDT) *</label>
                        <input type="number" id="payAmount" placeholder="e.g. 500" min="1" required>
                    </div>
                    <button type="submit" class="btn btn-success" style="width:100%"><i class="fa-solid fa-check"></i> Collect Payment</button>
                </form>
            </div>

            <div class="section">
                <div class="section-header">
                    <h2 id="formTitle"><i class="fa-solid fa-user-plus" style="color: var(--primary-color);"></i> 2. Registration Form</h2>
                </div>
                <form id="studentForm" class="form-vertical" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="studentIndex" value="">
                    <div class="form-group">
                        <label>Student Full Name *</label>
                        <input type="text" id="studentName" placeholder="Enter name" required>
                    </div>
                    <div class="form-group">
                        <label>Assign Class *</label>
                        <select id="
